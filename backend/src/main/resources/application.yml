server:
  port: 8080

spring:
  application:
    name: shop-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/shop_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${SHOP_DB_PASSWORD}
    port: 3307

  redis:
    host: localhost
    port: 6379
    password: ${SHOP_REDIS_PASSWORD:}
    timeout: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.shop.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: ${SHOP_JWT_SECRET}
  expiration: 604800000

logging:
  level:
    com.example.shop: debug
    org.springframework.security: info
